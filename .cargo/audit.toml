# What `cargo audit` leaves out, and why. An entry goes away when the crate that pulls the old version moves on.
[advisories]
ignore = [
    # The default HTTPS client of the AWS SDK (aws-smithy-http-client 1.5) still depends on hyper 0.14, h2 0.3
    # and rustls 0.21, next to the hyper 1 and rustls 0.23 that the rest of the program uses. Those old versions
    # get no fixes. The program only reaches the AWS endpoints with them, as a client.
    "RUSTSEC-2026-0258", # h2 0.3
    "RUSTSEC-2026-0346", # rustls 0.21
    "RUSTSEC-2026-0349", # rustls 0.21
    "RUSTSEC-2026-0098", # rustls-webpki 0.101
    "RUSTSEC-2026-0099", # rustls-webpki 0.101
    "RUSTSEC-2026-0104", # rustls-webpki 0.101
    "RUSTSEC-2026-0382", # rustls-webpki 0.101
]
