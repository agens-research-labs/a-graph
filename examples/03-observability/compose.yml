name: a-graph-observability

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector.yml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger
    mem_limit: 256m

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "1000"
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    mem_limit: 512m
