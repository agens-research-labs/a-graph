[package]
name = "a-graph"
version = "0.11.1"
edition = "2024"
authors = ["Fabio Gagliardi"]
description = "Runs a graph of agents written in a YAML file."
license = "MIT"
repository = "https://github.com/agens-labs/a-graph"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
# the parser under serde_norway: its events are read to refuse aliases before they are copied (`src/yaml.rs`)
unsafe-libyaml-norway = "0.2"
serde_path_to_error = "0.1"
# preserve_order: a schema reaches the model with its keys in the order they are written
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# gzip, deflate: a url answered compressed is read as what it holds; written here, not left to another crate
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "gzip", "deflate"] }
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "signal"] }
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
http = "1"
url = "2"
async-trait = "0.1.92"
thiserror = "2.0.21"
base64 = "0.23.1"
google-cloud-auth = "1.17.0"
azure_identity = "1.0.0"
azure_core = "1.1.0"
aws-config = "1.12.0"
aws-sdk-bedrockruntime = "1.148.0"
aws-smithy-types = "1.8.1"
aws-sdk-bedrock = "1.161.0"
aws-sdk-s3 = "1.152.0"
aws-types = "1.6.0"
uuid = { version = "1.28.0", features = ["v4"] }
futures-util = "0.3"
jsonschema = { version = "0.60.0", default-features = false }

[dev-dependencies]
# `test-util`: a test with a paused clock, for a limit of time that a real wait would make long
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "test-util"] }
# a test server that answers compressed, as a url may
flate2 = "1"

# no debug information for the dependencies in development and test builds: the test programs
# go from about 540 MB to about 190 MB each; the code of the project keeps it whole
[profile.dev.package."*"]
debug = false

[lints.clippy]
# the shapes of the tests and of the builders are long on purpose: a name for each would hide them, not help
type_complexity = "allow"
# the service answers a refusal as a whole HTTP response in the `Err` of a result: that is the point of it
result_large_err = "allow"
