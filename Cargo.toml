[package]
name = "a-graph"
version = "0.1.0"
edition = "2024"
authors = ["Fabio Gagliardi"]
description = "Runs a graph of agents written in a YAML file."
license = "MIT"
repository = "https://github.com/agens-labs/a-graph"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
serde_path_to_error = "0.1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
http = "1"
async-trait = "0.1.92"
thiserror = "2.0.21"
base64 = "0.23.1"
google-cloud-auth = "1.17.0"
azure_identity = "1.0.0"
azure_core = "1.1.0"
aws-config = "1.12.0"
aws-sdk-bedrockruntime = "1.148.0"
aws-smithy-types = "1.8.1"
aws-sdk-bedrock = "1.161.0"
aws-sdk-s3 = "1.152.0"
aws-types = "1.6.0"
uuid = { version = "1.28.0", features = ["v4"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

# no debug information for the dependencies in development and test builds: the test programs
# go from about 540 MB to about 190 MB each; the code of the project keeps it whole
[profile.dev.package."*"]
debug = false
