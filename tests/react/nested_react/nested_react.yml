# A react graph that is only built, never run. A react whose worker is another react, then a react with a react in a group among its workers: both are refused.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
resources:
  prompts:
    - id: p_s
      content: { system: "", user: "S({{user_message}})" }
    - id: p_c
      content: { system: "", user: "C({{agent_message}})" }
    - id: p_w1
      content: { system: "", user: "W1({{agent_message}})" }
    - id: p_x
      content: { system: "", user: "X({{agent_message}})" }
    - id: p_z
      content: { system: "", user: "Z({{agent_message}})" }
    - id: p_y
      content: { system: "", user: "Y({{agent_message}})" }
graph:
  nodes:
    - id: s
      model: { id: m }
      resources: { prompt: p_s }
      message:
        input: { user_message: true }
        output: { assistant_message: true, node: true }
    - id: c
      model: { id: m }
      resources: { prompt: p_c }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: w1
      model: { id: m }
      resources: { prompt: p_w1 }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: x
      model: { id: m }
      resources: { prompt: p_x }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: z
      model: { id: m }
      resources: { prompt: p_z }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: c2
      model: { id: m }
      resources: { prompt: p_y }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: gi
      model: { id: m }
      resources: { prompt: p_y }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: w2
      model: { id: m }
      resources: { prompt: p_y }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: go
      model: { id: m }
      resources: { prompt: p_y }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: x2
      model: { id: m }
      resources: { prompt: p_y }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
  edges:
    - start: s
    - react:
        controller: c
        max_iterations: 3
        structured_output: api
        components:
          - react:
              controller: w1
              max_iterations: 2
              structured_output: api
              components:
                - worker: x
    - react:
        controller: c2
        max_iterations: 3
        structured_output: api
        components:
          - linear:
              - in: gi
              - fan:
                  - react:
                      controller: w2
                      max_iterations: 2
                      structured_output: api
                      components:
                        - worker: x2
              - out: go
    - end: z
