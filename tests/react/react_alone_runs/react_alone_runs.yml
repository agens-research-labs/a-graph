# A graph on a mock model ({{port:model}}, started by the test) that answers with the text it was asked, so the answer of a node shows what it received. A react alone, with no `start` and no `end`: controller c, which takes the message of the user, and worker w1.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
resources:
  prompts:
    - id: p_c
      content: { system: "", user: "C({{user_message}})" }
    - id: p_w1
      content: { system: "", user: "W1({{agent_message}})" }
graph:
  nodes:
    - id: c
      model: { id: m }
      resources: { prompt: p_c }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
    - id: w1
      model: { id: m }
      resources: { prompt: p_w1 }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
  edges:
    - react:
        controller: c
        max_iterations: 3
        structured_output: api
        components:
          - worker: w1
