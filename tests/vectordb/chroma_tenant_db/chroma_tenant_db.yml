# One node `n` with a chromadb vectordb in tenant `acme`, database `sales` (mock on port 19403, the test starts it); embedding mock 19402, model mock 19401.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:19401
    input: [text]
    output: [text]
embeddings:
  - id: emb
    provider: ollama
    model: embeddinggemma
    host: http://127.0.0.1:19402
resources:
  prompts:
    - id: pr
      content:
        system: "Answer with the context."
        user: "Context: {{chunks}} / Question: {{user_message}}"
external:
  vectordb:
    - id: contracts_db
      provider: chromadb
      url: http://127.0.0.1:19403
      collection: contracts
      top_k: 3
      tenant: acme
      database: sales
      embedding: emb
graph:
  nodes:
    - id: n
      model: { id: m, max_tokens: 50 }
      resources: { prompt: pr }
      external:
        vectordb:
          - { id: contracts_db, query: user_message }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: n
    - end: n
