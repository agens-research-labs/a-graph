# One node `n` with a qdrant vectordb that never answers ({{port:vectordb}}, the test starts it) and `timeout: 1`; embedding mock on {{port:embedding}}, model mock on {{port:model}}.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
embeddings:
  - id: emb
    provider: ollama
    model: embeddinggemma
    host: http://127.0.0.1:{{port:embedding}}
resources:
  prompts:
    - id: pr
      content:
        system: "Answer with the context."
        user: "Context: {{chunks}} / Question: {{user_message}}"
external:
  vectordb:
    - id: contracts_db
      provider: qdrant
      url: http://127.0.0.1:{{port:vectordb}}
      collection: contracts
      top_k: 2
      timeout: 1
      embedding: emb
      text_field: text
      api_key: { env: VECTORDB_TEST_KEY }
graph:
  nodes:
    - id: n
      model: { id: m, max_tokens: 50 }
      resources: { prompt: pr }
      external:
        vectordb:
          - { id: contracts_db, query: user_message }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: n
    - end: n
