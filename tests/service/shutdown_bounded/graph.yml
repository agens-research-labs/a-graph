# The graph a caller sends to the service: node a answers (model mock on {{port:model}}) and writes its board `notes`,
# the file notes.md in the folder of the session, a copy of board.md made by the test.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
resources:
  prompts:
    - id: pa
      content:
        system: "Take notes."
        user: "Q: {{user_message}}"
blackboards:
  - id: notes
    source: { file: notes.md }
graph:
  nodes:
    - id: a
      model: { id: m, max_tokens: 50 }
      resources: { prompt: pa }
      blackboard: { id: notes, write: { enabled: true, place: bottom } }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: a
