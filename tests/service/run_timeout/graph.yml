# The graph a caller sends to the service: node a answers (model mock on {{port:model}}, slower than the timeout).
# The log goes to `run.log` in the folder of the session.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error, output: { file: run.log } }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
resources:
  prompts:
    - id: pa
      content:
        system: "Be brief."
        user: "Q: {{user_message}}"
graph:
  nodes:
    - id: a
      model: { id: m, max_tokens: 50 }
      resources: { prompt: pa }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: a
