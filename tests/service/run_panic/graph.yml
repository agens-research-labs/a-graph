# One node `n` on the model `m`; the unit test `run_panicked_failed` of src/service/runs.rs replaces `m` with a model that panics. The host is never called.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:11434
    input: [text]
    output: [text]
resources:
  prompts:
    - id: p
      content:
        system: "Be brief."
        user: "Q: {{user_message}}"
graph:
  nodes:
    - id: n
      model: { id: m, max_tokens: 50 }
      resources: { prompt: p }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: n
    - end: n
