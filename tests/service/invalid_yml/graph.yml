# The graph a caller sends to the service: node a passes its answer on, node b answers (model mock on port 19993).
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:19993
    input: [text]
    output: [text]
resources:
  prompts:
    - id: pa
      content:
        system: "Be brief."
        user: "Q: {{user_message}}"
    - id: pb
      content:
        system: "Be brief."
        user: "From a: {{agent_message}}"
graph:
  nodes:
    - id: a
      model: { id: nope, max_tokens: 50 }
      resources: { prompt: pa }
      message:
        input: { user_message: true }
        output: { node: true }
    - id: b
      model: { id: nope, max_tokens: 50 }
      resources: { prompt: pb }
      message:
        input: { agent_message: true }
        output: { assistant_message: true }
  edges:
    - start: a
    - end: b
