# A tool header sends a listed variable to a host listed for it; the tool is never called.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1, localhost] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
resources:
  prompts:
    - id: p
      content:
        system: "Be brief."
        user: "Q: {{user_message}}"
  tools:
    - id: send
      description: sends the text
      transport: http
      url: http://127.0.0.1:1/send
      headers: { X-Key: { env: A_GRAPH_ENV_ALLOWED } }
      max_iter: 1
      timeout: 5
      parameters: { type: object, properties: { text: { type: string } } }
graph:
  nodes:
    - id: a
      model: { id: m, max_tokens: 50 }
      resources: { prompt: p }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: a
