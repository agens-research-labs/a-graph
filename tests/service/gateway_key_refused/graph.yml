# An anthropic model goes through a gateway: its key is sent to the gateway, which the variable may not reach.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1, localhost] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: anthropic
    model: claude-haiku-4-5
    api_key: { env: A_GRAPH_GATEWAY_KEY }
    host: http://localhost:1/anthropic
    input: [text]
    output: [text]
resources:
  prompts:
    - id: p
      content:
        system: "Be brief."
        user: "Q: {{user_message}}"
graph:
  nodes:
    - id: a
      model: { id: m, max_tokens: 50 }
      resources: { prompt: p }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: a
