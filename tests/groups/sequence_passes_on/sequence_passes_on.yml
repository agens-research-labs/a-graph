# A graph on a mock model (port 18201, started by the test) that answers with the text it was asked, so the answer of a node shows what it received. start a, next b, end c.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:18201
    input: [text]
    output: [text]
resources:
  prompts:
    - id: p_a
      content: { system: "", user: "A({{user_message}})" }
    - id: p_b
      content: { system: "", user: "B({{agent_message}})" }
    - id: p_c
      content: { system: "", user: "C({{agent_message}})" }
graph:
  nodes:
    - id: a
      model: { id: m }
      resources: { prompt: p_a }
      message:
        input: { user_message: true }
        output: { assistant_message: true, node: true }
    - id: b
      model: { id: m }
      resources: { prompt: p_b }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: c
      model: { id: m }
      resources: { prompt: p_c }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
  edges:
    - start: a
    - next: b
    - end: c
