# The log goes to a url whose host is not allowed, with a header read from the environment.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: refused_log_url
    description: the log goes to a host the passport does not allow
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [localhost:11434] } }
observability:
  level: warn
  output:
    url: http://127.0.0.1:{{port:sink}}/log
    headers:
      Authorization: { env: A_GRAPH_REFUSED_LOG_TOKEN }
verbose: { level: off }
models:
  - id: local
    provider: ollama
    model: qwen3.5:4b
    host: http://localhost:11434
    input: [text]
    output: [text]
resources:
  prompts:
    - id: answer
      content:
        system: "Answer in one short sentence."
        user: "{{user_message}}"
graph:
  nodes:
    - id: assistant
      model: { id: local, max_tokens: 300 }
      resources: { prompt: answer }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: assistant
