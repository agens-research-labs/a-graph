# The trace goes to a host the passport does not allow, and its header names a variable that is not set.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: trace_before_env
    description: a refused trace host and a missing variable in the same graph
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [localhost:11434] } }
observability: { level: warn }
trace:
  endpoint: https://collector.example.com/v1/traces
  headers:
    Authorization: { env: A_GRAPH_TRACE_BEFORE_ENV_UNSET }
verbose: { level: off }
models:
  - id: local
    provider: ollama
    model: qwen3.5:4b
    host: http://localhost:11434
    input: [text]
    output: [text]
resources:
  prompts:
    - id: answer
      content:
        system: "Answer in one short sentence."
        user: "{{user_message}}"
graph:
  nodes:
    - id: assistant
      model: { id: local, max_tokens: 300 }
      resources: { prompt: answer }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: assistant
