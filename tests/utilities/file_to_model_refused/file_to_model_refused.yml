# A node reads a media of type `file` from the node before, with no utility.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:19939
    input: [text]
    output: [text]
utilities:
  - id: up
    transport: stdio
    command: /bin/sh
    args: ["tests/utilities/file_to_model_refused/files/scripts/up.sh"]
    timeout: 5
resources:
  media:
    - id: report
      type: file
  prompts:
    - id: pr
      content:
        system: "Be brief."
        user: "Q: {{user_message}}"
graph:
  nodes:
    - id: a
      model: { id: m, max_tokens: 50 }
      resources: { prompt: pr }
      media:
        output: [ { id: report, from: message, utility: [up], node: true } ]
      message:
        input: { user_message: true }
        output: { assistant_message: true }
    - id: n
      model: { id: m, max_tokens: 50 }
      resources: { prompt: pr }
      media:
        input: [ { id: report, from: node } ]
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: a
    - end: n
