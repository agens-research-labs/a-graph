# A media from the resources, a file `contract.pdf`, changed by a utility into text (model mock {{port:model}}).
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
utilities:
  - id: conv
    transport: stdio
    command: /bin/sh
    args: ["tests/utilities/media_file_utility/files/scripts/conv.sh"]
    timeout: 5
resources:
  media:
    - id: contract
      type: md
      source: { path: ./tests/utilities/media_file_utility/files/contract.pdf }
  prompts:
    - id: pr
      content:
        system: "Be brief."
        user: "Q: {{user_message}}"
graph:
  nodes:
    - id: n
      model: { id: m, max_tokens: 50 }
      resources: { prompt: pr }
      media:
        input: [ { id: contract, from: resources, utility: [conv] } ]
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: n
    - end: n
