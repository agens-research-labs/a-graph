# Two media of the graph in base64, one with its type and one without, given to a utility on http (service mock on
# {{port:utility}}, model mock {{port:model}}).
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
utilities:
  - id: conv
    transport: http
    url: http://127.0.0.1:{{port:utility}}/conv
    timeout: 5
resources:
  media:
    - id: typed
      type: md
      source: { base64: SGVsbG8=, mime_type: application/pdf }
    - id: plain
      type: md
      source: { base64: QUJD }
  prompts:
    - id: pr
      content:
        system: "Be brief."
        user: "Q: {{user_message}}"
graph:
  nodes:
    - id: n
      model: { id: m, max_tokens: 50 }
      resources: { prompt: pr }
      media:
        input:
          - { id: typed, from: resources, utility: [conv] }
          - { id: plain, from: resources, utility: [conv] }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: n
    - end: n
