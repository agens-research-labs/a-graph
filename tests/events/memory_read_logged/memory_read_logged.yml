# A node reads a memory, the log at debug in a file (port 19751): the reading is an event.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: debug, output: { file: ./target/test-output/memory_read_logged.log } }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:19751
    input: [text]
    output: [text]
resources:
  prompts:
    - id: pr
      content:
        system: "Be brief."
        user: "Question: {{user_message}}"
external:
  memory:
    - id: session
      provider: json_file
      path: ./tests/events/memory_read_logged/files/session.json
      chat: { length: 2 }
graph:
  nodes:
    - id: n
      model: { id: m, max_tokens: 50 }
      resources: { prompt: pr }
      external:
        memory:
          - { id: session, read: { user: true, assistant: true }, write: { user: false, assistant: false } }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: n
    - end: n
