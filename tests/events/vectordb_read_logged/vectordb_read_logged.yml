# A node reads a qdrant vectordb, the log at debug in a file (ports 19741-19743): the reading is an event.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: debug, output: { file: ./target/test-output/vectordb_read_logged.log } }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:19741
    input: [text]
    output: [text]
embeddings:
  - id: emb
    provider: ollama
    model: embeddinggemma
    host: http://127.0.0.1:19742
resources:
  prompts:
    - id: pr
      content:
        system: "Answer with the context."
        user: "Context: {{chunks}} / Question: {{user_message}}"
external:
  vectordb:
    - id: contracts_db
      provider: qdrant
      url: http://127.0.0.1:19743
      collection: contracts
      top_k: 2
      embedding: emb
      text_field: text
      api_key: { env: VECTORDB_TEST_KEY }
graph:
  nodes:
    - id: n
      model: { id: m, max_tokens: 50 }
      resources: { prompt: pr }
      external:
        vectordb:
          - { id: contracts_db, query: user_message }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: n
    - end: n
