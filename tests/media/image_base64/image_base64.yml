# One node `n`, the model is a mock server on port 18111 (the test starts it). The node reads an image media; the model takes images.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:18111
    input: [text, image]
    output: [text]
resources:
  media:
    - id: pic
      type: { img: png }
      source: { path: ./tests/media/image_base64/files/run_node/pic.png }
graph:
  nodes:
    - id: n
      model: { id: m }
      media: { input: [ { id: pic, from: resources } ] }
      message: { input: { user_message: true }, output: { assistant_message: true } }
  edges:
    - start: n
    - end: n
