# Two nodes. `a` makes the image `cover` (openai, it is never called here); `n`, whose model is a mock server on {{port:model}} (the test starts it), takes the media `cover` of the node before it; the model takes images.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1, api.openai.com] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text, image]
    output: [text]
  - id: smart
    provider: openai
    model: gpt-image-1
    input: [text]
    output: [text, image]
    api_key: { env: OPENAI_API_KEY }
resources:
  media:
    - id: cover
      type: { img: png }
      generate: {}
graph:
  nodes:
    - id: a
      model: { id: smart }
      media: { output: [ { id: cover, node: true } ] }
      message: { input: { user_message: true } }
    - id: n
      model: { id: m }
      media: { input: [ { id: cover, from: node } ] }
      message: { input: { user_message: true }, output: { assistant_message: true } }
  edges:
    - start: a
    - end: n
