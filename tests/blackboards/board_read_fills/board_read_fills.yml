# One node `n` that reads its board and uses {{bb}} in the prompt. The model is a mock on {{port:model}}; the board is a file written by the test in target/test-boards/.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
resources:
  prompts:
    - id: pr
      content:
        system: "Use the notes."
        user: "Notes: {{bb}} / Question: {{user_message}}"
blackboards:
  - id: bb
    source: { file: ./target/test-boards/board_read_fills.md }
graph:
  nodes:
    - id: n
      model: { id: m }
      resources: { prompt: pr }
      blackboard: { id: bb, read: true }
      message: { input: { user_message: true }, output: { assistant_message: true } }
  edges:
    - start: n
    - end: n
