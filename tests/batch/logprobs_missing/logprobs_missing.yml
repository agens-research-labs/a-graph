# A `batch` of two nodes `d` and `e` that ask the logprobs. The model `m` is replaced by the test with one that gives none.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [api.openai.com] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: openai
    model: gpt-5
    api_key: { env: OPENAI_API_KEY }
    input: [text]
    output: [text]
resources:
  prompts:
    - id: p_s
      content: { system: "", user: "S({{user_message}})" }
    - id: p_i
      content: { system: "", user: "I({{agent_message}})" }
    - id: p_d
      content: { system: "", user: "D({{agent_message}})" }
    - id: p_e
      content: { system: "", user: "E({{agent_message}})" }
    - id: p_f
      content: { system: "", user: "F({{agent_message}})" }
    - id: p_z
      content: { system: "", user: "Z({{agent_message}})" }
graph:
  nodes:
    - id: s
      model: { id: m }
      resources: { prompt: p_s }
      message:
        input: { user_message: true }
        output: { node: true }
    - id: i
      model: { id: m }
      resources: { prompt: p_i }
      message:
        input: { agent_message: true }
        output: { node: true }
    - id: d
      model: { id: m }
      resources: { prompt: p_d }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true, logprobs: 0 }
    - id: e
      model: { id: m }
      resources: { prompt: p_e }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true, logprobs: 0 }
    - id: f
      model: { id: m }
      resources: { prompt: p_f }
      message:
        input: { agent_message: true }
        output: { node: true }
    - id: z
      model: { id: m }
      resources: { prompt: p_z }
      message:
        input: { agent_message: true }
        output: { assistant_message: true }
  edges:
    - start: s
    - batch:
        - in: i
        - fan:
            - next: d
            - next: e
        - out: f
    - end: z
