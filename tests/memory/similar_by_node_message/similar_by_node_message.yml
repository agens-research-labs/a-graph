# The node takes only the message of the node before: the similar exchanges are searched with it (model mock {{port:model}}, embedding mock {{port:embedding}}).
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
embeddings:
  - id: emb
    provider: ollama
    model: embeddinggemma
    host: http://127.0.0.1:{{port:embedding}}
resources:
  prompts:
    - id: pr
      content:
        system: "Be brief."
        user: "From the node before: {{agent_message}}"
external:
  memory:
    - id: session
      provider: json_file
      path: ./target/test-memory/similar_by_node_message.json
      chat: { length: 1, embedding: emb }
graph:
  nodes:
    - id: n
      model: { id: m, max_tokens: 50 }
      resources: { prompt: pr }
      external:
        memory:
          - { id: session, read: { user: true, assistant: true }, write: { user: false, assistant: false } }
      message:
        input: { agent_message: true }
        output: { assistant_message: true }
  edges:
    - start: n
    - end: n
