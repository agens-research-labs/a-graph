# Node `n` with a memory whose file is not a list of records and quotes data, under a passport that forbids contents (model mock {{port:model}}).
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: confidential, categories: [pii] }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error, output: { file: ./target/test-output/memory_file_kept_out.log } }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
resources:
  prompts:
    - id: pr
      content:
        system: "Be brief."
        user: "Question: {{user_message}}"
external:
  memory:
    - id: session
      provider: json_file
      path: ./target/test-memory/memory_file_kept_out.json
      chat: { length: 2 }
graph:
  nodes:
    - id: n
      model: { id: m, max_tokens: 50 }
      resources: { prompt: pr }
      external:
        memory:
          - { id: session, read: { user: true, assistant: true }, write: { user: true, assistant: true } }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: n
    - end: n
