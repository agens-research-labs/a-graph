# With `chat.embedding` the vector of the user message is saved next to it (model mock 19604, embedding mock 19605).
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:19604
    input: [text]
    output: [text]
embeddings:
  - id: emb
    provider: ollama
    model: embeddinggemma
    host: http://127.0.0.1:19605
resources:
  prompts:
    - id: pr
      content:
        system: "Be brief."
        user: "Question: {{user_message}}"
external:
  memory:
    - id: session
      provider: json_file
      path: ./target/test-memory/saves_vector.json
      chat: { length: 5, embedding: emb }
graph:
  nodes:
    - id: n
      model: { id: m, max_tokens: 50 }
      resources: { prompt: pr }
      external:
        memory:
          - { id: session, read: { user: true, assistant: true }, write: { user: true, assistant: true } }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: n
    - end: n
