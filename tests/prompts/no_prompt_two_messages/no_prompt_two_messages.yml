# One node `n` that takes both messages and has no prompt: the loader refuses it.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:18104
    input: [text]
    output: [text]
graph:
  nodes:
    - id: n
      model: { id: m }
      message: { input: { user_message: true, agent_message: true }, output: { assistant_message: true } }
  edges:
    - start: n
    - end: n
