graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: trace-test
    description: Trace content policy test.
    version: "2.3.4"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
trace:
  endpoint: http://127.0.0.1:{{port:collector}}/v1/traces
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
resources:
  prompts:
    - id: p
      content: { system: "Answer briefly.", user: "{{user_message}}" }
graph:
  nodes:
    - id: s
      model: { id: m }
      resources: { prompt: p }
      message:
        input: { user_message: true }
        output: { assistant_message: true }
  edges:
    - start: s
