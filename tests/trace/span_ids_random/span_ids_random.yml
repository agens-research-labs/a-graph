# Two nodes (model mock {{port:model}}, collector mock {{port:collector}}): each program numbers its spans.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
trace:
  endpoint: http://127.0.0.1:{{port:collector}}/v1/traces
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
resources:
  prompts:
    - id: p_s
      content: { system: "", user: "S({{user_message}})" }
    - id: p_z
      content: { system: "", user: "Z({{agent_message}})" }
graph:
  nodes:
    - id: s
      model: { id: m }
      resources: { prompt: p_s }
      message:
        input: { user_message: true }
        output: { assistant_message: true, node: true }
    - id: z
      model: { id: m }
      resources: { prompt: p_z }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
  edges:
    - start: s
    - end: z
