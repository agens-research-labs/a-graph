# The passport forbids contents (internal data) (model mock {{port:model}}, collector mock {{port:collector}}).
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: internal }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
trace:
  endpoint: http://127.0.0.1:{{port:collector}}/v1/traces
  headers:
    Authorization: { env: TRACE_TOKEN }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
resources:
  prompts:
    - id: p_s
      content: { system: "", user: "S({{user_message}})" }
    - id: p_i
      content: { system: "", user: "I({{agent_message}})" }
    - id: p_d
      content: { system: "", user: "D({{agent_message}})" }
    - id: p_j
      content: { system: "", user: "J({{agent_message}})" }
    - id: p_k
      content: { system: "", user: "K({{agent_message}})" }
    - id: p_m
      content: { system: "", user: "M({{agent_message}})" }
    - id: p_f
      content: { system: "", user: "F({{agent_message}})" }
    - id: p_z
      content: { system: "", user: "Z({{agent_message}})" }
graph:
  nodes:
    - id: s
      model: { id: m }
      resources: { prompt: p_s }
      message:
        input: { user_message: true }
        output: { assistant_message: true, node: true }
    - id: i
      model: { id: m }
      resources: { prompt: p_i }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: d
      model: { id: m }
      resources: { prompt: p_d }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: j
      model: { id: m }
      resources: { prompt: p_j }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: k
      model: { id: m }
      resources: { prompt: p_k }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: mm
      model: { id: m }
      resources: { prompt: p_m }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: f
      model: { id: m }
      resources: { prompt: p_f }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
    - id: z
      model: { id: m }
      resources: { prompt: p_z }
      message:
        input: { agent_message: true }
        output: { assistant_message: true, node: true }
  edges:
    - start: s
    - parallel:
        - in: i
        - fan:
            - next: d
            - linear:
                - in: j
                - fan:
                    - next: k
                - out: mm
        - out: f
    - end: z
