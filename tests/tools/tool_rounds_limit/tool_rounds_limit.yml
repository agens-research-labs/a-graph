# The model keeps asking for a tool the node does not have, which no max_iter counts; max_rounds stops it (model on {{port:model}}, started by the test).
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
resources:
  prompts:
    - id: p_s
      content: { system: "", user: "S({{user_message}})" }
    - id: p_n
      content: { system: "", user: "N({{agent_message}})" }
    - id: p_q
      content: { system: "", user: "Q({{user_message}})" }
    - id: p_e
      content: { system: "", user: "E({{agent_message}})" }
  tools:
    - id: t
      description: "Tells what it received"
      max_iter: 3
      timeout: 30
      transport: stdio
      command: /bin/sh
      args: ["tests/tools/tool_rounds_limit/files/tools/echo.sh"]
      parameters: { type: object, properties: { city: { type: string } }, required: [city] }
graph:
  nodes:
    - id: s
      model: { id: m }
      resources: { prompt: p_s }
      message:
        input: { user_message: true }
        output: { assistant_message: true, node: true }
    - id: n
      model: { id: m }
      resources: { prompt: p_q, tools: [t], max_rounds: 2 }
      message:
        input: { user_message: true }
        output: { assistant_message: true, node: true }
    - id: e
      model: { id: m }
      resources: { prompt: p_e }
      message:
        input: { agent_message: true }
        output: { assistant_message: true }
  edges:
    - start: n
    - end: e
