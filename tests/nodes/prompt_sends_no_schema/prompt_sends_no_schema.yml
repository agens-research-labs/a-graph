# One node `n`, the model is a mock server on {{port:model}} (the test starts it). The node has a `schema_prompt`.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:{{port:model}}
    input: [text]
    output: [text]
graph:
  nodes:
    - id: n
      model: { id: m }
      message:
        input: { user_message: true }
        output: { assistant_message: true, schema_prompt: { type: object, properties: { a: { type: integer } }, required: [a] } }
  edges:
    - start: n
    - end: n
