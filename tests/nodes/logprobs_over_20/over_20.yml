# One node `n` that asks 21 alternatives of each token: the most is 20.
graph_spec: "1.0"
passport:
  adl:
    adl_spec: "0.3.0"
    name: t
    description: t
    version: "1.0.0"
    data_classification: { sensitivity: public }
    permissions: { network: { allowed_hosts: [127.0.0.1] } }
observability: { level: error }
verbose: { level: off }
models:
  - id: m
    provider: ollama
    model: m
    host: http://127.0.0.1:11434
    input: [text]
    output: [text]
graph:
  nodes:
    - id: n
      model: { id: m }
      message:
        input: { user_message: true }
        output: { assistant_message: true, logprobs: 21 }
  edges:
    - start: n
    - end: n
