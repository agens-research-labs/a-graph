# The checks of every pull request and of every push to main: the commit messages of a pull request, the formatting, the build, clippy, the tests, the
# advisories on the crates of Cargo.lock, the Docker image. On a push to main the tests run on macOS too.
# CONTRIBUTING.md says how to run the same checks by hand.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push to the same branch stops the checks of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # every commit of a pull request against the rules of AGENTS.md, with the hook of .githooks: pull requests are merged
  # fast-forward, so their commits reach main as they are
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for commit in $(git rev-list --reverse "$BASE..$HEAD"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            if ! .githooks/commit-msg "$RUNNER_TEMP/message"; then
              echo "::error::$(git log -1 --format='%h %s' "$commit")"
              failed=1
            fi
          done
          exit "$failed"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the Rust of rust-toolchain.toml, installed by the rustup of the runner
      - run: rustup toolchain install
      # the dependencies and the build output are kept between runs; tests/mcp_server is a project of its own,
      # built by the tests into target/mcp-test-server
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            tests/mcp_server -> ../../target/mcp-test-server
      # tests/mcp_server is a crate of its own: the first command does not reach it
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path tests/mcp_server/Cargo.toml
      - run: cargo build --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast

  # the same tests on macOS, where the filesystem ignores case and the pipes of a child are created in two steps
  # (CONTRIBUTING.md): on every push to main only, since a minute of macOS costs ten of Linux
  test-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            tests/mcp_server -> ../../target/mcp-test-server
      - run: cargo test --locked --no-fail-fast

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the layers of the image, the one of the dependencies first, are kept in the cache of GitHub between runs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
