# The checks of every pull request and of every push to main: the build, clippy, the tests, the advisories on the
# crates of Cargo.lock, the Docker image. CONTRIBUTING.md says how to run the same checks by hand.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push to the same branch stops the checks of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the Rust of rust-toolchain.toml, installed by the rustup of the runner
      - run: rustup toolchain install
      # the dependencies and the build output are kept between runs; tests/mcp_server is a project of its own,
      # built by the tests into target/mcp-test-server
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            tests/mcp_server -> ../../target/mcp-test-server
      - run: cargo build --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the Dockerfile arrives with the docker pull request: until it is merged there is nothing to build
      - if: hashFiles('Dockerfile') != ''
        run: docker build .
